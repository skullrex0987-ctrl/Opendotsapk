name: Build APK

# Builds a release APK in GitHub's cloud (free for public repos).
# No local machine or VPS resources required.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # --- diagnostics: is the llama.cpp plugin actually part of the build? ---
      - name: Diagnose plugin wiring
        run: |
          echo "### .flutter-plugins-dependencies"
          cat .flutter-plugins-dependencies || echo "(missing)"
          echo
          echo "### Gradle subprojects"
          cd android && ./gradlew projects --console=plain -q 2>&1 | head -60; cd ..

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/localmind-release.apk

      # --- gate: the app is useless without the native llama.cpp runtime ---
      - name: Verify native libraries
        run: |
          echo "### .so files shipped in the APK"
          unzip -l out/localmind-release.apk | grep -E "\.so$" || true
          echo
          if unzip -l out/localmind-release.apk | grep -q "libllama"; then
            echo "OK: llama.cpp native runtime is present."
          else
            echo "::error::libllama*.so missing - local inference would fail at runtime."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localmind-apk
          path: out/localmind-release.apk
          retention-days: 30
