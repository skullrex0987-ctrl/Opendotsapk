name: Build APK

# Builds a release APK in GitHub's cloud (free for public repos).
# No local machine or VPS resources required.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/localmind-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localmind-apk
          path: out/localmind-release.apk
          retention-days: 30
