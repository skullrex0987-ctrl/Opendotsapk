name: Build APK

# Builds a release APK in GitHub's cloud (free for public repos).
# No local machine or VPS resources required.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The Vulkan backend's flash-attention kernels exist only as generated
      # SPIR-V blobs, so the backend cannot link without this shader compiler.
      # Its absence is the single cause of both historical link failures
      # (ggml_backend_vk_reg, then flash_attn_f32_f16_f32_data).
      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            glslc spirv-tools libvulkan-dev vulkan-tools
          echo
          echo "### glslc"
          which glslc && glslc --version
          echo
          echo "### Vulkan headers/libs visible to CMake"
          ls /usr/include/vulkan 2>/dev/null | head -5 || echo "(no host vulkan headers)"

      # Enables GPU offload when glslc is present, and degrades to a CPU-only
      # link when it is not — rather than failing the build outright.
      - name: Patch native_llama for Android
        run: python3 scripts/patch_native_llama.py

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # Hard gate. These cover the pure logic that breaks silently:
      # the float32 vector codec, at-rest encryption, BM25 fusion, document
      # extraction, and the local/cloud routing rules.
      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      # --- diagnostics: is the llama.cpp plugin actually part of the build? ---
      - name: Diagnose plugin wiring
        run: |
          echo "### .flutter-plugins-dependencies"
          cat .flutter-plugins-dependencies || echo "(missing)"
          echo
          echo "### Gradle subprojects"
          cd android && ./gradlew projects --console=plain -q 2>&1 | head -60; cd ..

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/localmind-release.apk

      # --- gate: the app is useless without the native runtimes --------------
      # Two silent-failure modes bit this project before, both because the
      # plugin's CMake pointed at a llama.cpp/ tree that the pub archive never
      # shipped: the build succeeded and the APK shipped with no native code at
      # all. Fail loudly here instead of shipping a chat app that cannot chat.
      - name: Verify native libraries
        run: |
          echo "### .so files shipped in the APK"
          unzip -l out/localmind-release.apk | grep -E "\.so$" || true
          echo
          fail=0
          for lib in libllama libggml libonnxruntime; do
            if unzip -l out/localmind-release.apk | grep -q "$lib"; then
              echo "OK: $lib present."
            else
              echo "::error::$lib missing - on-device inference would fail at runtime."
              fail=1
            fi
          done
          # native_llama vendors tools/mtmd, but compiles it straight into
          # libnative_llama.so rather than shipping a separate libmtmd.so — so
          # check the symbols, not a filename, or this warns forever.
          unzip -o -q out/localmind-release.apk \
            "lib/arm64-v8a/libnative_llama.so" -d "$RUNNER_TEMP/apkcheck"
          if strings "$RUNNER_TEMP/apkcheck/lib/arm64-v8a/libnative_llama.so" \
               | grep -qiE "mtmd|ggml_clip"; then
            echo "OK: mtmd/CLIP vision code is linked in."
          else
            echo "::error::no mtmd symbols in libnative_llama.so - vision will not work."
            fail=1
          fi

          # GPU is reported, not required: an APK without a Vulkan backend is
          # still a working app that runs on the CPU. Silence here would hide a
          # regression though, so the failure mode is a loud warning.
          echo
          if unzip -l out/localmind-release.apk \
               | grep -qE "libggml-vulkan\.so"; then
            echo "OK: Vulkan backend shipped - GPU offload available."
            unzip -o -q out/localmind-release.apk \
              "lib/arm64-v8a/libggml-vulkan.so" -d "$RUNNER_TEMP/apkcheck"
            if strings "$RUNNER_TEMP/apkcheck/lib/arm64-v8a/libggml-vulkan.so" \
                 | grep -qi "ggml_backend_vk_reg"; then
              echo "OK: Vulkan backend registers itself with ggml."
            else
              echo "::warning::libggml-vulkan.so is present but exposes no backend entry point."
            fi
          else
            echo "::warning::No Vulkan backend in the APK - GPU offload will not engage; inference runs on the CPU."
          fi

          exit $fail

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localmind-apk
          path: out/localmind-release.apk
          retention-days: 30
