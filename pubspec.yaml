name: localmind
description: A fully local, privacy-first AI agent that runs entirely on-device.
publish_to: 'none'
# The version name must equal the release tag (v1.2.0 -> 1.2.0): the release
# workflow fails the build when the APK's versionName disagrees with the tag, so
# a drift here is caught before anything ships. The build number is only a
# local default — CI overrides it with the run number so versionCode is
# monotonic across releases.
version: 1.6.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local LLM + vision (llama.cpp via MethodChannel).
  #
  # Bindings evaluated, so nobody repeats the search:
  #  - llama_cpp_dart / flutter_llama: their CMake points at a `llama.cpp/`
  #    directory that is missing from the published pub archive -> the APK
  #    builds but ships without libllama.so and the LLM silently never loads.
  #  - llama_flutter_android: packages libllama.so correctly, but ships no mtmd,
  #    so no vision model can ever be loaded.
  #  - native_llama 1.0.1 (MIT): vendors the whole llama.cpp tree including
  #    tools/mtmd, so mmproj vision works, and ships a complete
  #    ggml/src/ggml-vulkan backend. Its CMake sets GGML_VULKAN=ON and
  #    ggml-vulkan/CMakeLists.txt does `find_package(Vulkan COMPONENTS glslc
  #    REQUIRED)`. glslc is the GLSL->SPIR-V shader compiler, and without it the
  #    backend target is never created while -DGGML_USE_VULKAN=1 is still
  #    defined, giving `undefined symbol: ggml_backend_vk_reg` followed by
  #    `undefined symbol: flash_attn_f32_f16_f32_data` (that kernel exists only
  #    as a generated SPIR-V blob). Installing glslc fixes both — CI does, and
  #    the APK ships GPU support. scripts/patch_native_llama.py enables Vulkan
  #    when glslc is present and falls back to a CPU-only link when it is not.
  #    See docs/GPU_ACCELERATION.md.
  native_llama: ^1.0.1

  # Vector database / SQLite
  sqflite: ^2.3.3
  sqlite3: ^2.4.0

  # ONNX embeddings (API verified for 1.4.x)
  onnxruntime: ^1.4.1

  # Attachments: images for the vision model, files for document ingestion.
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  # EPUB and DOCX are ZIP containers; decoding them in-process avoids pulling
  # in a document SDK.
  archive: ^4.4.0
  mime: ^2.1.0

  # Secrets: API keys for BYOK cloud models and the at-rest database key.
  # Values live in the Android Keystore, never in shared_preferences.
  flutter_secure_storage: ^11.2.0
  # AES-GCM for message/memory contents at rest. Pure Dart on purpose — see
  # the note at the top of lib/core/security/crypto_box.dart.
  cryptography: ^2.9.0
  local_auth: ^3.0.2

  # Receiving a share from other apps (text or an image straight into chat).
  receive_sharing_intent: ^1.9.0

  # Voice
  speech_to_text: ^7.5.0
  flutter_tts: ^4.0.2

  # Background tasks
  # (flutter_foreground_task removed: unused, and its 6.x Android host still
 #  used the v1 embedding that Flutter >=3.29 deleted.)
  workmanager: ^0.10.10

  # Network
  http: ^1.2.1

  # Permissions & location
  permission_handler: ^11.3.1
  geolocator: ^11.1.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Device capability probing: SoC/hardware identity decides how many layers we
  # dare to offload to the GPU, and which NPU (if any) is present.
  #
  # Must be ^13: v11 depends on win32 ^5, and share_plus 13 requires win32 ^6,
  # so v11 cannot coexist with the share sheet.
  device_info_plus: ^13.3.0

  # The version shown in Settings must be read from the installed package, not
  # a compiled-in constant — the constant it replaces had drifted (the UI said
  # 1.0.0 while the release tag was v1.2.0). See AppConstants.resolvedVersion().
  #
  # Must be ^10. package_info_plus 8.x AND 9.x still depend on win32 ^5.5.3,
  # which cannot coexist with share_plus 13.3.1 / device_info_plus 13.3.0 (both
  # win32 ^6.0.1) — the same conflict class that forced device_info_plus to 13.
  # 10.x depends on win32 ^6.0.1, and its SDK floor (Dart >=3.10.0, Flutter
  # >=3.38.1) is exactly that of those two packages, so it resolves as a set.
  package_info_plus: ^10.2.2

  # UI / export
  uuid: ^4.4.0
  flutter_markdown: ^0.7.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
