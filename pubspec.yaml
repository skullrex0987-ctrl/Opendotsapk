name: localmind
description: A fully local, privacy-first AI agent that runs entirely on-device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local LLM (llama.cpp FFI bindings — API verified for 0.2.x)
  llama_cpp_dart: ^0.2.2

  # Vector database / SQLite
  sqflite: ^2.3.3
  sqlite3: ^2.4.0

  # ONNX embeddings (API verified for 1.4.x)
  onnxruntime: ^1.4.1

  # Voice
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

  # Background tasks
  workmanager: ^0.5.2
  flutter_foreground_task: ^6.3.3

  # Network
  http: ^1.2.1

  # Permissions & location
  permission_handler: ^11.3.1
  geolocator: ^11.1.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  uuid: ^4.4.0
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
