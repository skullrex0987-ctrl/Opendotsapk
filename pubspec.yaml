name: localmind
description: A fully local, privacy-first AI agent that runs entirely on-device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local LLM + vision (llama.cpp via MethodChannel).
  #
  # Bindings evaluated, so nobody repeats the search:
  #  - llama_cpp_dart / flutter_llama: their CMake points at a `llama.cpp/`
  #    directory that is missing from the published pub archive -> the APK
  #    builds but ships without libllama.so and the LLM silently never loads.
  #  - llama_flutter_android: packages libllama.so correctly, but ships no mtmd,
  #    so no vision model can ever be loaded.
  #  - native_llama 1.0.1 (MIT): vendors the whole llama.cpp tree including
  #    tools/mtmd, so mmproj vision works. It does force GGML_VULKAN=ON against
  #    a vendored ggml-cpu that has no flash-attention kernels, which fails to
  #    link with hundreds of `undefined symbol: div_f32_f16_f32_len` errors.
  #    scripts/patch_native_llama.py turns Vulkan off before the Gradle build,
  #    which fixes it; inference then runs on the CPU backend.
  native_llama: ^1.0.1

  # Vector database / SQLite
  sqflite: ^2.3.3
  sqlite3: ^2.4.0

  # ONNX embeddings (API verified for 1.4.x)
  onnxruntime: ^1.4.1

  # Voice
  speech_to_text: ^7.5.0
  flutter_tts: ^4.0.2

  # Background tasks
  # (flutter_foreground_task removed: unused, and its 6.x Android host still
 #  used the v1 embedding that Flutter >=3.29 deleted.)
  workmanager: ^0.10.10

  # Network
  http: ^1.2.1

  # Permissions & location
  permission_handler: ^11.3.1
  geolocator: ^11.1.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  uuid: ^4.4.0
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
